android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.code.style=official

# Work around intermittent Gradle cache packaging corruption on Windows worktrees.
org.gradle.caching=true
org.gradle.configuration-cache=false
# Память важнее скорости тёплых сборок (владелец, 2026-09-22): демон само-останавливается
# через 15 с после последней команды — команды подряд остаются тёплыми, а после завершения
# работы память освобождается сама (Gradle-демон + Kotlin-демон суммарно держали ~10 ГБ).
org.gradle.daemon.idletimeout=15000
org.gradle.configureondemand=false
# Heap rebalanceado para esta VM (7,7 GB RAM, sin swap ampliable): el daemon
# Gradle usa ~0,5 GB de heap vivo, pero el compilador Kotlin del módulo :app
# (2274 archivos + Compose) se ahogaba con 2g (428 full GC, 77% del tiempo
# en GC), y con 3g llegó a codegen pero murió con OutOfMemoryError dentro del
# inliner de Compose al compilar NovelReaderContentHost (un lambda gigante
# con ~200 capturas). Con 4g el compilador sí aguantaba, pero el kernel mató
# el proceso por OOM (RSS ~4,7 GB). Kotlin 5g con Gradle a 512m (solo para compilar; luego se vuelve a 1g para empaquetar)
# para el inliner y con RSS total dentro de la RAM. Gradle 512m en fase de compilación, 1g en fase de empaquetado. En un equipo
# con más RAM se pueden volver a subir ambos.
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
# Prefer the default Kotlin daemon for large release compiles; in-process was slower here.
# kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx6656m -Djava.net.preferIPv4Stack=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.workers.max=2
