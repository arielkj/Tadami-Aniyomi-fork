name: Build Mapa Radio debug APK

on:
  push:
    branches: [mapa-radio]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mapa-radio
        uses: actions/checkout@v4
        with:
          ref: mapa-radio

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ya trae un Android SDK (ANDROID_HOME). No usar
      # android-actions/setup-android: falla con cmdline-tools 16.0.
      # sdkmanager no esta en PATH; vive en
      # $ANDROID_HOME/cmdline-tools/latest/bin.
      - name: Install Android SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | "$SDKMGR" --licenses

      # Con flavors, la variante de pruebas es assemblePhoneDebug
      # (la del radio es assembleRadioRelease, en build-mapa-final.yml).
      - name: Build debug APK
        run: ./gradlew :app:assemblePhoneDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mapa-radio-debug-apk
          path: app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
